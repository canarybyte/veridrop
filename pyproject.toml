[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-detector"
version = "0.1.0"
description = "Veridrop · AI API relay station quality and authenticity detector"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Veridrop" }]
readme = "README.md"
requires-python = ">=3.10"
urls = { Homepage = "https://veridrop.org", Repository = "https://github.com/canarybyte/veridrop" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "reportlab>=4.0",  # only for scripts/build_test_pdf.py — runtime doesn't need it
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pillow>=10.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    # SQLAlchemy 的 async 引擎硬依赖 greenlet；CPython 3.14 起不会再随
    # SQLAlchemy 自动装，显式写进来保证新环境一次装好。
    "greenlet>=3.2",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    # API Key 加密存储(Fernet);凭据库是 Web 控制台专属能力。
    "cryptography>=42",
]

[project.scripts]
relay-detector = "relay_detector.cli:app"
veridrop = "relay_detector.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"relay_detector.protocols.anthropic" = ["data/*.json", "data/*.pdf"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
